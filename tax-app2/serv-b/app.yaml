apiVersion: apps/v1
kind: Deployment
metadata: 
  name: serv-b
  labels:
    app: serv-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serv-b
  template:
    metadata:
      labels:
        app: serv-b
    spec:
      containers:
        - name: serv-b
          image: embarkx/tax-service-b:latest
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: serv-b   #this is service name, which is used to access the service from other services
spec:
  type: ClusterIP 
  selector:
    app: serv-b
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
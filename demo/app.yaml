apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: nginx:latest
        ports:
        - containerPort: 80
        # Inside your deployment.yaml container spec...
        env:
        # 1. Pulling from the ConfigMap
        - name: ENVIRONMENT_TYPE
          valueFrom:
            configMapKeyRef:
              name: app-config         # The name of your ConfigMap
              key: ENVIRONMENT_TYPE    # The specific piece of data you want
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config         # The name of your ConfigMap
              key: DATABASE_URL        # The specific piece of data you want
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: app-config         # The name of your ConfigMap
              key: APP_MESSAGE         # The specific piece of data you want
        # 2. Pulling from the Secret
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret         # The name of your Secret
              key: DATABASE_PASSWORD   # The specific piece of data you want
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  type: NodePort
  selector:
    # This selector is the magic link. It tells the Service to route
    # traffic ONLY to Pods that have the label "app: web"
    app: myapp
  ports:
    - protocol: TCP
      port: 80          # The port the Service listens on internally
      targetPort: 80    # The port your Nginx container is listening on
      nodePort: 31000   # The exact port exposed on your local machine (http://localhost:32000)


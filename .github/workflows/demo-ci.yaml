name: Global K8s CI Pipeline # The title of this workflow shown in the GitHub Actions dashboard

on: # The 'motion sensor' that tells GitHub exactly when to wake up and run this pipeline
  push: # Trigger the pipeline whenever someone pushes code to the repository
    branches: 
      - main # Specifically, only run if the push is directly to the 'main' branch
    paths: # Only wake up if files inside these three specific microservice folders are modified
      - 'demo/**' 
      - 'app1_hello/**'
      - 'tax-app2/**'

jobs: # The actual list of tasks we want the cloud server to execute
  validate-yaml: # A custom name we created for this specific block of work
    runs-on: ubuntu-latest # Tells GitHub to create a fresh, temporary Linux virtual machine just for this run

    steps: 
    - name: 1. Checkout Code 
      uses: actions/checkout@v4 

    - name: 2. Install Kubeconform
      run: |
        # Downloading the official Kubeconform tool directly to the cloud runner
        wget https://github.com/yannh/kubeconform/releases/download/v0.6.3/kubeconform-linux-amd64.tar.gz
        tar xf kubeconform-linux-amd64.tar.gz
        sudo mv kubeconform /usr/local/bin/

    - name: 3. Lint Kubernetes Manifests
      run: |
        # Scanning all YAML files to ensure they are valid Kubernetes resources
        kubeconform -summary -ignore-missing-schemas demo/ app1_hello/ tax-app2/

    - name: 4. Create Cloud Kubernetes Cluster (kind)
      uses: helm/kind-action@v1.10.0 # A pre-built GitHub tool that instantly spins up a temporary cluster

    - name: 5. Deploy Microservices to Cluster
      run: |
        # Using kubectl to apply our freshly linted files directly to the temporary cloud cluster
        kubectl apply -f demo/
        kubectl apply -f app1_hello/
        kubectl apply -f tax-app2/

    - name: 6. Verify Cluster State
      run: |
        # Pausing for 10 seconds to let the pods boot up, then printing the cluster status
        sleep 10 
        kubectl get all -A
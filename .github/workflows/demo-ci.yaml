name: Global K8s CI Pipeline # The title of this workflow shown in the GitHub Actions dashboard

on: # The 'motion sensor' that tells GitHub exactly when to wake up and run this pipeline
  push: # Trigger the pipeline whenever someone pushes code to the repository
    branches: 
      - main # Specifically, only run if the push is directly to the 'main' branch
    paths: # Only wake up if files inside these three specific microservice folders are modified
      - 'demo/**' 
      - 'app1_hello/**'
      - 'tax-app2/**'

jobs: # The actual list of tasks we want the cloud server to execute
  validate-yaml: # A custom name we created for this specific block of work
    runs-on: ubuntu-latest # Tells GitHub to create a fresh, temporary Linux virtual machine just for this run

    steps: # The step-by-step instructions the temporary Linux machine must follow
    - name: 1. Checkout Code # The display title for this step in the GitHub logs
      uses: actions/checkout@v4 # A pre-built GitHub tool that securely downloads your code onto the blank Linux machine

    - name: 2. Validate All YAML Syntax # The display title for the validation step
      run: | # The pipe symbol (|) lets us write a multi-line Linux terminal command below
        # This Python script acts as a global search-and-check tool. 
        # It recursively hunts down every .yaml and .yml file in your entire project and verifies the syntax is perfect.
        python3 -c 'import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True)]'